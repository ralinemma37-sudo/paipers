<!DOCTYPE html>
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Plaidoc</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Plaidoc web : la barre de défilement reste visible à droite (l'appli la masque sur téléphone). */
      /* « auto » (et pas « thin ») : sinon Chrome sous Windows 11 cache la barre tant que la souris n'est pas dessus,
         et ignore le style ci-dessous. */
      * {
        scrollbar-width: auto !important;
      }
      /* Chrome récents : la propriété standard « scrollbar-color » donne une vraie barre toujours visible
         (même avec les barres « superposées » de Windows 11 qui disparaissent sinon). */
      @supports (scrollbar-color: auto) {
        * {
          scrollbar-color: #a48db3 rgba(73, 54, 83, 0.08) !important;
        }
        /* Espace Pro : barre bleu marine (retour Vanessa 18/10). */
        html[data-paipers-space="pro"] * {
          scrollbar-color: #1a2b4a rgba(26, 43, 74, 0.1) !important;
        }
      }
      html[data-paipers-space="pro"] *::-webkit-scrollbar-thumb {
        background: #1a2b4a;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar {
        display: block !important;
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background: #b8a7c4;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #8e6a9e;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-track {
        background: rgba(73, 54, 83, 0.06);
        border-radius: 10px;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/app/favicon.ico" /></head>
